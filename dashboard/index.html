    <script>
      // Light paper is the stage default. Apply a saved choice before first paint (the header toggle writes it).
      try {
        var t = localStorage.getItem("ss-theme-v2");
        if (t === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
